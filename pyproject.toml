[project]
name = "pi-study"
version = "0.1.0"
description = "A minimal Python coding agent — learning Pi-Agent by rebuilding its core ideas"
readme = "README.md"
authors = [
    { name = "JiYueBo666", email = "32221349735@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "textual>=8.2.8",
]

[project.scripts]
pi-study = "coding_agent.cli:main"
mypi = "tui_app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai", "src/agent_core", "src/coding_agent", "src/tui", "src/tui_app"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "basic"
reportMissingImports = true
venvPath = "."
venv = ".venv"
